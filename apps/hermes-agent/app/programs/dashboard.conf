[program:dashboard]
command=/opt/hermes/.venv/bin/hermes dashboard --host 0.0.0.0 --port 9119 --no-open
; the dashboard's auth gate engages on non-loopback binds and fails closed
; without a registered auth provider (e.g. dashboard.basic_auth in config.yaml)
directory=/opt/data
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
