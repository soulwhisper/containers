packages:
  - .

# Modeled on the installer's OUTPUT workspace (not the source repo's, whose
# patchedDependencies cover pocket/web-mobile and fail ERR_PNPM_UNUSED_PATCH
# under pnpm 11). When bumping the tavern ref, re-check the source patches/
# dir and prune patchedDependencies to the actually installed set.
nodeLinker: hoisted
autoInstallPeers: false
confirmModulesPurge: false
ignorePnpmfile: true
allowBuilds:
  node-pty: false
minimumReleaseAgeExclude:
  - dsh-mnemon-source-runtime@0.5.14
  - dsh-mnemon-strategy-default-three-tier@0.5.9
  - dsh-mnemon@0.5.31
  - dsh-mnemon-source-memory-spaces@0.5.21
  - '@deepseek-ai/cosmokit@1.8.6'
  - '@deepseek-ai/schemastery@3.18.5'
  - dsh-better-sidebar@0.28.0
patchedDependencies:
  dsh-better-sidebar@0.28.0: patches/dsh-better-sidebar@0.28.0.patch
