[supervisord]
nodaemon=true
logfile=/tmp/manyfold/supervisord.log
pidfile=/tmp/manyfold/supervisord.pid
childlogdir=/tmp/manyfold
logfile_maxbytes=10MB
logfile_backups=1

[program:redis]
command=redis-server --bind 127.0.0.1 --save "" --appendonly no
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:manyfold]
command=/usr/local/bin/manyfold-start.sh foreman start
directory=/usr/src/app
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
